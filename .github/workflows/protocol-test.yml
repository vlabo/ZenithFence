name: Protocol Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-protocol:
    name: Run protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kext_interface/go.mod
          cache-dependency-path: kext_interface/go.sum

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: cargo-protocol-${{ runner.os }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-protocol-${{ runner.os }}-

      # go_command_test.bin is generated by the Go side and consumed by the Rust
      # test below. It is gitignored, so regenerate it here (mirrors the Justfile
      # `kext-interface-gen` recipe) before cargo test reads it. rust_info_test.bin
      # is (re)generated by `cargo test` itself.
      - name: Generate Go command fixture
        working-directory: ./kext_interface
        run: go test -run TestGenerateCommandFile

      - name: Run tests
        working-directory: ./protocol
        run: cargo test

      # rust_info_test.bin is (re)generated by the protocol tests and is the
      # cross-check fixture consumed by the kext_interface Go tests.
      - name: Upload test fixtures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-bin
          path: protocol/*.bin
          if-no-files-found: warn
