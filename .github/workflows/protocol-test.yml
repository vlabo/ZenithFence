name: Protocol Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-protocol:
    name: Run protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kext_interface/go.mod
          cache-dependency-path: kext_interface/go.sum

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: cargo-protocol-${{ runner.os }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-protocol-${{ runner.os }}-

      # go_command_test.bin and go_command_diff.bin are generated by the Go side
      # and consumed by the Rust tests below. They are gitignored, so regenerate
      # them here (mirrors the Justfile `kext-interface-gen` recipe) before cargo
      # test reads them.
      - name: Generate Go command fixtures
        working-directory: ./kext_interface
        run: go test -run 'TestGenerateCommandFile|TestGenerateCommandDiff'

      # Also (re)generates rust_info_test.bin and info_diff.bin for the Go side.
      - name: Run Rust protocol tests
        working-directory: ./protocol
        run: cargo test

      # Rust -> Go direction: parse the info fixtures written by cargo test.
      - name: Run Go protocol tests
        working-directory: ./kext_interface
        run: go test -run 'TestRustInfoFile|TestInfoDiffFile'

      # The fixtures generated above, for inspecting a failing run.
      - name: Upload test fixtures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-bin
          path: protocol/*.bin
          if-no-files-found: warn
