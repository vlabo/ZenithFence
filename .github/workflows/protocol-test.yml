name: Protocol Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-protocol:
    name: Run protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: cargo-protocol-${{ runner.os }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-protocol-${{ runner.os }}-

      - name: Run tests
        working-directory: ./protocol
        run: cargo test

      # rust_info_test.bin is (re)generated by the protocol tests and is the
      # cross-check fixture consumed by the kext_interface Go tests.
      - name: Upload test fixtures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-bin
          path: protocol/*.bin
          if-no-files-found: warn
