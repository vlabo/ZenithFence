name: Build

# Builds and links the kernel driver (driver.sys + driver.pdb, unsigned) and
# keeps it as the `driver` artifact of the run. On a published release it builds
# the release profile and attaches the driver to the release as well.
#
# PRs, plus pushes to main. A push to a PR branch already runs through
# `pull_request`; triggering on every branch push too ran each job twice.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver:
    name: Build & link driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up MSVC dev environment
        # Puts link.exe on PATH and sets LIB/INCLUDE for the x64 toolchain.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            driver/kernel/target
          key: cargo-driver-${{ runner.os }}-${{ hashFiles('driver/kernel/Cargo.lock') }}
          restore-keys: cargo-driver-${{ runner.os }}-

      # Releases ship the release profile; PRs and main build debug, like
      # `just link` without --release.
      - name: Choose profile
        shell: pwsh
        run: |
          $profile = if ("${{ github.event_name }}" -eq "release") { "release" } else { "debug" }
          "PROFILE=$profile" >> $env:GITHUB_ENV
          Write-Host "building the $profile profile"

      # driver/kernel is the production build root (crate-type = "staticlib"):
      # `cargo build` compiles driver_kernel.lib and surfaces any compilation errors.
      - name: Build driver
        working-directory: ./driver/kernel
        shell: pwsh
        run: |
          if ($env:PROFILE -eq "release") { cargo build --locked --release } else { cargo build --locked }

      # Link driver.lib into the .sys, mirroring the Justfile `link` recipe.
      # The WDK static libs referenced via #[link(kind="static")]
      # live in the repo; pass their dir as /LIBPATH so link.exe resolves them
      # on the runner (the absolute search paths baked in by cargo don't exist
      # here). Signing is omitted: it needs the DriverCertificate private key,
      # which is not in the repo.
      - name: Link driver (driver.sys)
        shell: pwsh
        run: |
          Copy-Item ./driver/kernel/target/x86_64-pc-windows-msvc/$env:PROFILE/driver_kernel.lib ./driver.lib
          link.exe /OUT:driver.sys /RELEASE /DEBUG /NOLOGO /NXCOMPAT `
            /NODEFAULTLIB /SUBSYSTEM:NATIVE /DRIVER /DYNAMICBASE /MANIFEST:NO `
            /PDBALTPATH:driver.pdb /MACHINE:X64 /OPT:REF,ICF /SUBSYSTEM:NATIVE,6.01 `
            /ENTRY:GsDriverEntry "/MERGE:.edata=.rdata;_TEXT=.text;_PAGE=PAGE" `
            /MERGE:.rustc=.data /INTEGRITYCHECK `
            /LIBPATH:libs/x64 driver.lib

      - name: Upload driver artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: driver
          path: |
            driver.sys
            driver.pdb
          if-no-files-found: error

      # Optional: rebrand driver.sys -> <product>.sys by re-linking driver.lib.
      # The product name is not committed -- it comes from the repo variable
      # DRIVER_PRODUCT_NAME. If unset, this step and its upload are skipped and
      # the public artifact stays driver.sys.
      - name: Rebrand driver (optional)
        if: vars.DRIVER_PRODUCT_NAME != ''
        shell: pwsh
        run: ./scripts/rebrand-driver.ps1 -Name '${{ vars.DRIVER_PRODUCT_NAME }}'

      - name: Upload rebranded artifact (unsigned)
        if: vars.DRIVER_PRODUCT_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.DRIVER_PRODUCT_NAME }}
          path: |
            ${{ vars.DRIVER_PRODUCT_NAME }}.sys
            ${{ vars.DRIVER_PRODUCT_NAME }}.pdb
          if-no-files-found: error

  # Release only: attach the driver built above to the release, zipped with its
  # PDB and named after the tag so the download says what it is.
  publish:
    name: Attach driver to the release
    if: github.event_name == 'release'
    needs: build-driver
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: driver
          path: driver

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip -j "driver-$TAG-unsigned.zip" driver/driver.sys driver/driver.pdb
          gh release upload "$TAG" "driver-$TAG-unsigned.zip" --clobber --repo "$GITHUB_REPOSITORY"
