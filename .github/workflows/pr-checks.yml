name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `just test` runs:
      #   - kext-interface-gen   (regenerate Go command fixture)
      #   - test-protocol        (Rust protocol parsers + bounds regression tests)
      #   - test-kext-interface  (Go <-> Rust differential on the .bin fixtures)
      #   - test-driver          (host property tests against mock_wdk)
      # None of these need the WDK / a kernel.
      - name: Run tests
        run: just test

  # End-to-end simulation on Linux: the real driver over mock_wdk in the zf-sim
  # daemon, driven by the real Go agent over a Unix domain socket. The agent
  # spawns the daemon and exits with its pass/fail code. mixed_v4v6_parallel has
  # no `dns` op, so the run stays offline and deterministic.
  sim-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Sim unit tests
        run: just sim-test

      - name: Replay scenario end-to-end
        run: |
          just sim-emit-samples
          timeout 300 just sim-scenario ./sim/scenarios/mixed_v4v6_parallel.cbor
