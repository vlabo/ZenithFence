name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `just test` runs:
      #   - kext-interface-gen   (regenerate Go command fixture)
      #   - test-protocol        (Rust protocol parsers + bounds regression tests)
      #   - test-kext-interface  (Go <-> Rust differential on the .bin fixtures)
      #   - test-driver          (the driver's own unit tests, over the mock WDK)
      # None of these need the WDK / a kernel.
      - name: Run tests
        run: just test

  # Simulation on Linux: the scenario tests in mock/sim/tests, the real driver over
  # mock_wdk driven from Python in-process, with agents (PipeAgent and the Go
  # test agent) attached over a Unix socket.
  sim-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mock

      - name: Scenario tests
        run: timeout 300 just sim-test
