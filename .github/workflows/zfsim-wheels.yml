name: zfsim wheels

# Builds the zfsim wheels (Windows, Linux and macOS x86_64) in the same
# container as `just sim-wheels`, installs the Windows and Linux ones into a
# clean Python and runs the scenario tests against them, and attaches all three
# to the GitHub release. Colleagues then install with e.g.
#   pip install https://github.com/<owner>/<repo>/releases/download/v2.0.3/zfsim-2.0.3-cp39-abi3-win_amd64.whl
# A manual run builds and tests only (wheels stay on the run as an artifact).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Wheel version (default: kext_interface/version.txt)"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Release: the tag without its "v" (v2.0.3 -> 2.0.3). Manual run: the
      # input, else the driver version.
      - name: Wheel version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            version="${TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(python3 sim/build.py --version)"
          fi
          echo "wheel version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build wheels (sim/docker/wheels.Dockerfile)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker buildx build -f sim/docker/wheels.Dockerfile
          --build-arg "VERSION=$VERSION"
          --target wheels --output type=local,dest=sim/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: zfsim-wheels
          path: sim/dist/*.whl
          if-no-files-found: error

  # The macOS wheel is built but not run here: the hosted macOS runners are
  # arm64, and an arm64 Python can't load an x86_64 extension.
  test:
    name: Test wheel (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          name: zfsim-wheels
          path: dist

      # pip picks the wheel for this OS; nothing comes from the source tree.
      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist zfsim

      - name: Scenario tests against the installed wheel
        timeout-minutes: 10
        run: python -m unittest discover -v -s sim/tests

  publish:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zfsim-wheels
          path: dist

      - name: Upload wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
