[package]
name = "driver-mock"
version = "0.1.0"
edition = "2021"

# The REAL driver, compiled for the host. This package has no source of its
# own: its library is driver/src/lib.rs -- the exact files driver/kernel ships --
# built with the Windows kernel API (`wdk`) swapped for the host mock in
# mock/wdk. Everything else (callouts, caches, device, protocol handling) is the
# production code. Keep the dependency list below in sync with driver/Cargo.toml.

[lib]
name = "driver"
path = "../../driver/src/lib.rs"

[dependencies]
# The one difference from driver/Cargo.toml: `wdk` resolves to the mock.
wdk = { package = "mock_wdk", path = "../wdk" }
protocol = { path = "../../protocol" }
num = { version = "0.4", default-features = false }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = ["proto-ipv4", "proto-ipv6", "medium-ethernet", "socket-raw"] }
