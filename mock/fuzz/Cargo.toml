[package]
name = "driver-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz / libFuzzer harness for the ZenithFence driver. This crate is the
# build root when fuzzing, so its profiles win. It drives the real driver code
# through mock/harness, which builds it against the host mock WDK (no kernel).
#
# Requires a nightly toolchain + `cargo install cargo-fuzz`. Most reliable on
# Linux/WSL (libFuzzer + AddressSanitizer). Run with: `just fuzz <target> <secs>`.

# Its own workspace: cargo-fuzz builds this crate on its own.
[workspace]

[package.metadata]
cargo-fuzz = true

# Shared fuzz-target logic, used by BOTH the libFuzzer targets (Linux) and the
# `replay` binary (runs on Windows). Keeps one source of truth.
[lib]
name = "driver_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"

# The harness drives the real driver (mock/driver) over the mock WDK.
[dependencies.driver_harness]
package = "driver-harness"
path = "../harness"

# Keep symbols/line info for good ASAN reports.
[profile.release]
debug = 1

# Windows-runnable replay / smoke runner (has a real main; no libFuzzer).
# `cargo run --bin replay -- <target> [files...]`
[[bin]]
name = "replay"
path = "src/bin/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "callouts"
path = "fuzz_targets/callouts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "callouts_mt"
path = "fuzz_targets/callouts_mt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simulation"
path = "fuzz_targets/simulation.rs"
test = false
doc = false
bench = false
