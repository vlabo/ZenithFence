# Host-side mock of the kernel driver and the Python module built on it:
#   wdk     -- the host mock of the Windows kernel API (package `mock_wdk`)
#   driver  -- the real driver/src compiled against it
#   harness -- loads the driver and drives its callouts like the kernel
#   sim     -- `zfsim`, the Python extension serving it to a real agent
# Nothing under mock/ is part of the shipped driver: driver/kernel (the
# production build root) never depends on these crates, and no file in driver/
# or wdk/ refers to them.
[workspace]
resolver = "2"
members = ["wdk", "driver", "harness", "sim"]
