[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "driver"
path = "src/lib.rs"
# A plain Rust library. The shipped driver.lib is produced by kernel/ (the
# production build root), which links this crate against the real `wdk`.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Production build (default): link the real kernel `wdk` + windows-sys.
default = ["real_wdk"]
real_wdk = ["dep:wdk", "dep:windows-sys"]

[dependencies]
wdk = { path = "../wdk", optional = true }
protocol = { path = "../protocol" }
num = { version = "0.4", default-features = false }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = ["proto-ipv4", "proto-ipv6", "medium-ethernet", "socket-raw"] }

# WARNING: Do not update. The version was chosen for a reason. See wdk/README.md for more details.
[dependencies.windows-sys]
git = "https://github.com/microsoft/windows-rs"
rev = "41ad38d8c42c92fd23fe25ba4dca76c2d861ca06"
optional = true
features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Power", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFilteringPlatform"]
